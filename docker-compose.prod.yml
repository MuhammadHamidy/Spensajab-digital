version: '3.8'

networks:
  # Network internal terisolasi khusus spensajab (DB & Redis aman)
  spensajab_internal:
    name: spensajab_internal
    driver: bridge
  # Network Docker bersama dengan spenspra-nginx
  spenspra:
    external: true

volumes:
  spensajab_postgres_data:
    name: spensajab_postgres_data
  spensajab_redis_data:
    name: spensajab_redis_data

services:
  # 1. PostgreSQL Database
  spensajab-postgres:
    image: postgres:15-alpine
    container_name: spensajab-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-spensajab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spensajab_secret_pass}
      POSTGRES_DB: ${DB_NAME:-spensajab_db}
    volumes:
      - spensajab_postgres_data:/var/lib/postgresql/data
    networks:
      - spensajab_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spensajab_user} -d ${DB_NAME:-spensajab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  spensajab-redis:
    image: redis:alpine
    container_name: spensajab-redis
    restart: always
    volumes:
      - spensajab_redis_data:/data
    networks:
      - spensajab_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Migration Runner
  spensajab-migrate:
    image: migrate/migrate
    container_name: spensajab-migrate
    volumes:
      - ./backend_fr/facerec/migrations:/migrations
    command: -path=/migrations -database 'postgres://${DB_USER:-spensajab_user}:${DB_PASSWORD:-spensajab_secret_pass}@spensajab-postgres:5432/${DB_NAME:-spensajab_db}?sslmode=disable' up
    networks:
      - spensajab_internal
    depends_on:
      spensajab-postgres:
        condition: service_healthy

  # 4. Initial Seeder (Roles, Akun Admin Awal)
  spensajab-seeder:
    image: postgres:15-alpine
    container_name: spensajab-seeder
    volumes:
      - ./backend_fr/facerec/seeders:/seeders
    environment:
      PGPASSWORD: ${DB_PASSWORD:-spensajab_secret_pass}
    command: >
      sh -c "for f in /seeders/*.sql; do psql -h spensajab-postgres -U ${DB_USER:-spensajab_user} -d ${DB_NAME:-spensajab_db} -f \"$$f\"; done"
    networks:
      - spensajab_internal
    depends_on:
      spensajab-migrate:
        condition: service_completed_successfully

  # 5. Backend Service (Go Fiber API)
  spensajab-backend:
    build:
      context: ./backend_fr
      dockerfile: facerec/Dockerfile
      target: Runtime
    container_name: spensajab-backend
    restart: always
    environment:
      APP_NAME: spensajab
      APP_ENV: production
      APP_PORT: 8080
      APP_POSTGRES_URL: "postgres://${DB_USER:-spensajab_user}:${DB_PASSWORD:-spensajab_secret_pass}@spensajab-postgres:5432/${DB_NAME:-spensajab_db}?sslmode=disable"
      APP_REDIS_ADDRESS: "spensajab-redis:6379"
      APP_REDIS_PASSWORD: ""
      APP_REDIS_DB: 0
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      APP_SERVICE_NAME: spensajab-api
      APP_CORS_ALLOWED_ORIGINS: "*"
      WA_API_URL: "${WA_API_URL:-https://api.fonnte.com/send}"
      WA_API_KEY: "${WA_API_KEY:-}"
      WA_SENDER_PHONE: "${WA_SENDER_PHONE:-}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SENDER_NAME: "${SMTP_SENDER_NAME:-SMPN 1 Jabon - Presensi Digital}"
      APP_PORTAL_URL: "https://${DOMAIN:-spensajab.sch.id}/login"
    networks:
      - spensajab_internal
      - spenspra
    depends_on:
      spensajab-postgres:
        condition: service_healthy
      spensajab-redis:
        condition: service_healthy
      spensajab-seeder:
        condition: service_completed_successfully

  # 6. Frontend Service (Next.js Standalone)
  spensajab-frontend:
    build:
      context: ./frontend_fr
      dockerfile: Dockerfile
      target: final
    container_name: spensajab-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://${DB_USER:-spensajab_user}:${DB_PASSWORD:-spensajab_secret_pass}@spensajab-postgres:5432/${DB_NAME:-spensajab_db}?schema=public"
      NEXT_PUBLIC_API_URL: "https://${DOMAIN:-spensajab.sch.id}/api"
      NEXT_PUBLIC_API_BASE_URL: "https://${DOMAIN:-spensajab.sch.id}/api"
      JWT_SECRET: "${JWT_SECRET:-spensajab_super_secret_jwt_key_2026}"
    networks:
      - spensajab_internal
      - spenspra
    depends_on:
      spensajab-postgres:
        condition: service_healthy
      spensajab-backend:
        condition: service_started
